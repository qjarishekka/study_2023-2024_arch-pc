      <script>
        const ctx = document.getElementById('myChart');

        let X = []
        let Y = []
        for(let i = 0 ; i <= 100 ; i++){
            X.push(i)
        }




        console.log(X)
      
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: X,
            datasets: [
            
            {
              label: '# of Votes',
              data: Y,
              borderWidth: 1,
              fill: {
                target: 'number',
                above: 'rgb(255, 255, 255)',   // Area will be red above the origin
                below: 'rgb(0, 0, 255)'    // And blue below the origin
              }
            },

        
        ]
          },
          options: {

                beginAtZero: true
              }
            }
