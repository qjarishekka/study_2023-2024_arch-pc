<!DOCTYPE html>
<html>

<head>

   <title>мой рынок</title>
   <link rel="shortcut icon" href="gato1.jpeg" />

   <link rel="stylesheet" href="style.css">

</head>

<script>





function Item(){

    let valor= document.getElementById('banana').value

    console.log(valor)

}


function addToList(){

    var lista = document.getElementById('lista')
    var check = document.querySelectorAll('.fruta')

    lista.innerHTML = ''
    check.forEach((e)=>{

        if(e.checked == true){
            var elemento = document.createElement('li')
            elemento.className = 'list-group-item'
            elemento.innerHTML = e.value
            lista.appendChild(elemento)

            console.log('aqui')
        }




    })


}

</script>

<body>
    <header>
        <h1> Мой рынок</h1>

    </header>


    <form submit = "alert('ejemplo')" id = "browser">
        <input type="text" id="barraDeBusqueda" placeholder="search">

        <button type="button" onclick="Item()" id="buscar">search</button>
    </form>




    <table>
        <tr>
            <td>
                вананы
            </td>
            <td>
                <input type="checkbox" id="banana" class="fruta" value="вананы">
            </td>
        </tr>

        <tr>
            <td>
                глубники
            </td>
            <td>
                <input type="checkbox" id="strawberry" class="fruta" value="глубники">
            </td>
        </tr>

    </table>



    <input type="submit" onclick="addToList()">



    <aside>
    <form submit = "alert" id = "login">
        <input type="text" id ="userID" placeholder="userID">
        <input type="password" id ="userPassword" placeholder="password">
        <button type="button">login</button>
    </form>

        <div>lista de compras</div>
        <ul id="lista" class="list-group"></ul>

    </aside>
    
</body>




</html>
